<!-- @dsCard group="Forms" height=300 subtitle="Text, invalid, select, search" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t||"blue-light")})();</script><meta charset="utf-8"><title>Input</title></head>
<body>
<div class="pd-root">
<div class="pd-grid2">
<div class="pd-field"><label for="a">Name</label><input class="pd-input" id="a" value="Arjun Rao"><span class="pd-hint">Shown before and after a Klick.</span></div>
<div class="pd-field"><label for="b">LinkedIn URL</label><input class="pd-input" id="b" value="linkedin.com/in/" aria-invalid="true"><span class="pd-error"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6M9 9l6 6"/></svg>Add your profile name after /in/.</span></div>
<div class="pd-field"><label for="c">Why are you going?</label><select class="pd-input" id="c"><option>Meet early-stage founders</option><option>Hire a designer</option></select></div>
<div class="pd-field"><label for="d">Search your Klicks</label><div class="pd-search"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input class="pd-input" id="d" placeholder="Designer I met at the meetup"></div></div>
</div>
</div>
<script>document.querySelectorAll('.pd-switch').forEach(function(s){s.addEventListener('click',function(){s.setAttribute('aria-checked',String(s.getAttribute('aria-checked')!=='true'))})});document.querySelectorAll('.pd-seg').forEach(function(t){t.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;t.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',String(x===b))})})});</script>
</body>
</html>
