<!-- @dsCard group="Forms" height=150 subtitle="Settings and share fields" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t||"blue-light")})();</script><meta charset="utf-8"><title>Switch</title></head>
<body>
<div class="pd-root">
<div class="pd-stack" style="max-width:420px">
<div class="pd-setting"><span>Discoverable at this event<small>Matches can see you before a Klick</small></span><button class="pd-switch" role="switch" aria-checked="true" aria-label="Discoverable at this event"></button></div>
<div class="pd-setting"><span>Share phone after Klick<small>Hidden</small></span><button class="pd-switch" role="switch" aria-checked="false" aria-label="Share phone after Klick"></button></div>
</div>
</div>
<script>document.querySelectorAll('.pd-switch').forEach(function(s){s.addEventListener('click',function(){s.setAttribute('aria-checked',String(s.getAttribute('aria-checked')!=='true'))})});document.querySelectorAll('.pd-seg').forEach(function(t){t.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;t.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',String(x===b))})})});</script>
</body>
</html>
