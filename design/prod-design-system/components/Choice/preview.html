<!-- @dsCard group="Forms" height=170 subtitle="Checkbox and radio" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t||"blue-light")})();</script><meta charset="utf-8"><title>Choice</title></head>
<body>
<div class="pd-root">
<div class="pd-grid2">
<div class="pd-stack"><label class="pd-check"><input type="checkbox" checked><span>Email<small>Visible after a mutual Klick</small></span></label><label class="pd-check"><input type="checkbox"><span>Phone<small>Hidden</small></span></label></div>
<div class="pd-stack"><label class="pd-check"><input type="radio" name="p" checked><span>Planning to attend</span></label><label class="pd-check"><input type="radio" name="p"><span>Invited</span></label><label class="pd-check"><input type="radio" name="p"><span>Hosting</span></label></div>
</div>
</div>
<script>document.querySelectorAll('.pd-switch').forEach(function(s){s.addEventListener('click',function(){s.setAttribute('aria-checked',String(s.getAttribute('aria-checked')!=='true'))})});document.querySelectorAll('.pd-seg').forEach(function(t){t.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;t.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',String(x===b))})})});</script>
</body>
</html>
