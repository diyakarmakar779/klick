<!-- @dsCard group="Actions" height=410 width=800 subtitle="Variants, icon + text, trailing chevron, sizes, states" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t||"blue-light")})();</script><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="pd-root">
<div class="pd-stack">
<div class="pd-row"><button class="pd-btn pd-btn--brand">Request a Klick</button><button class="pd-btn pd-btn--primary">Save changes</button><button class="pd-btn pd-btn--secondary">Save for event</button><button class="pd-btn pd-btn--outline">Review fields</button><button class="pd-btn pd-btn--ghost">Dismiss</button></div>
<div class="pd-row"><button class="pd-btn pd-btn--brand"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3M21 21v.01M12 7v3a2 2 0 0 1-2 2H7M3 12h.01M12 3h.01M12 16v.01M16 12h1M21 12v.01M12 21v-1"/></svg>Scan a QR code</button><button class="pd-btn pd-btn--primary"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3ZM19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>Add a voice note</button><button class="pd-btn pd-btn--secondary"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Add to calendar</button><button class="pd-btn pd-btn--destructive"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>Delete memory</button></div>
<div class="pd-row"><button class="pd-btn pd-btn--outline" aria-haspopup="menu">Planning to attend<svg class="pd-i pd-btn__chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><button class="pd-btn pd-btn--ghost">See all matches<svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button><button class="pd-btn pd-btn--primary"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4ZM22 2 11 13"/></svg>Send draft</button></div>
<div class="pd-row"><button class="pd-btn pd-btn--destructive">Remove connection</button><button class="pd-btn pd-btn--link">Why this match</button><button class="pd-btn pd-btn--secondary pd-btn--icon" aria-label="Save for event"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></button><button class="pd-btn pd-btn--ghost pd-btn--icon" aria-label="Dismiss"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
<div class="pd-row"><button class="pd-btn pd-btn--strong">Request a Klick</button><button class="pd-btn pd-btn--strong pd-btn--sm">Klick</button></div>
<div class="pd-row"><button class="pd-btn pd-btn--brand pd-btn--sm">Klick</button><button class="pd-btn pd-btn--primary pd-btn--sm">Save</button><button class="pd-btn pd-btn--brand pd-btn--lg">Scan a QR code</button></div>
<div class="pd-row"><button class="pd-btn pd-btn--brand" aria-busy="true"><span class="pd-btn__label">Request a Klick</span><span class="pd-btn__spin"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span></button><button class="pd-btn pd-btn--primary" aria-busy="true"><span class="pd-btn__label">Save changes</span><span class="pd-btn__spin"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg></span></button><button class="pd-btn pd-btn--brand" disabled>Request a Klick</button><button class="pd-btn pd-btn--primary" disabled>Save changes</button></div>
</div>
</div>
<script>document.querySelectorAll('.pd-switch').forEach(function(s){s.addEventListener('click',function(){s.setAttribute('aria-checked',String(s.getAttribute('aria-checked')!=='true'))})});document.querySelectorAll('.pd-seg').forEach(function(t){t.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;t.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',String(x===b))})})});</script>
</body>
</html>
