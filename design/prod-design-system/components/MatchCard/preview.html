<!-- @dsCard group="Klick" height=280 subtitle="Recommended person with the reason" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t||"blue-light")})();</script><meta charset="utf-8"><title>MatchCard</title></head>
<body>
<div class="pd-root">
<article class="pd-card" style="max-width:420px">
<div class="pd-person"><span class="pd-avatar pd-avatar--brand">MI</span><div><h4>Meera Iyer</h4><p>Product designer, Fernwood Labs</p></div></div>
<div class="pd-why"><b><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 3v4M21 5h-4"/></svg>Why this match</b>You both want to meet early-stage founders. Meera works on onboarding flows, which you listed as something you want help with.</div>
<div class="pd-chips"><span class="pd-badge pd-badge--outline">Onboarding</span><span class="pd-badge pd-badge--outline">User research</span><span class="pd-badge pd-badge--brand">Planning to attend</span></div>
<div class="pd-actions"><button class="pd-btn pd-btn--brand">Request a Klick</button><button class="pd-btn pd-btn--secondary pd-btn--icon" aria-label="Save for event"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg></button><button class="pd-btn pd-btn--ghost pd-btn--icon" aria-label="Dismiss"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
</article>
</div>
<script>document.querySelectorAll('.pd-switch').forEach(function(s){s.addEventListener('click',function(){s.setAttribute('aria-checked',String(s.getAttribute('aria-checked')!=='true'))})});document.querySelectorAll('.pd-seg').forEach(function(t){t.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;t.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',String(x===b))})})});</script>
</body>
</html>
