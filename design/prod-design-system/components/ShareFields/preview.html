<!-- @dsCard group="Klick" height=270 subtitle="Field-by-field consent before a Klick" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t||"blue-light")})();</script><meta charset="utf-8"><title>ShareFields</title></head>
<body>
<div class="pd-root">
<article class="pd-card" style="max-width:420px">
<h4 style="margin:0;font-size:15px">Share with Meera</h4><p style="margin:2px 0 0;font-size:13px;color:var(--muted-foreground)">She sees these after you both accept.</p>
<div class="pd-share" style="margin-top:8px">
<div class="pd-setting"><span>Name</span><span class="pd-locked"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Always shared</span></div>
<div class="pd-setting"><span>Email</span><button class="pd-switch" role="switch" aria-checked="true" aria-label="Share email"></button></div>
<div class="pd-setting"><span>Phone</span><button class="pd-switch" role="switch" aria-checked="false" aria-label="Share phone"></button></div>
<div class="pd-setting"><span>LinkedIn</span><button class="pd-switch" role="switch" aria-checked="true" aria-label="Share LinkedIn"></button></div>
</div>
<div class="pd-actions"><button class="pd-btn pd-btn--brand" style="flex:1">Accept and share 3 fields</button></div>
</article>
</div>
<script>document.querySelectorAll('.pd-switch').forEach(function(s){s.addEventListener('click',function(){s.setAttribute('aria-checked',String(s.getAttribute('aria-checked')!=='true'))})});document.querySelectorAll('.pd-seg').forEach(function(t){t.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;t.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',String(x===b))})})});</script>
</body>
</html>
