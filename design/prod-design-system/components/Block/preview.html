<!-- @dsCard group="Brand" height=260 subtitle="The product brick: 1, 4, 6 or 8 studs" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t||"blue-light")})();</script><meta charset="utf-8"><title>Block</title></head>
<body>
<div class="pd-root">
<div class="pd-row" style="gap:28px;align-items:flex-end"><span class="pd-block pd-block--1" style="--u:30px" aria-hidden="true"><span class="pd-stud"></span></span><span class="pd-block pd-block--4" style="--u:30px" aria-hidden="true"><span class="pd-stud"></span><span class="pd-stud"></span><span class="pd-stud"></span><span class="pd-stud"></span></span><span class="pd-block pd-block--6" style="--u:30px" aria-hidden="true"><span class="pd-stud"></span><span class="pd-stud"></span><span class="pd-stud"></span><span class="pd-stud"></span><span class="pd-stud"></span><span class="pd-stud"></span></span><span class="pd-block pd-block--8" style="--u:30px" aria-hidden="true"><span class="pd-stud"></span><span class="pd-stud"></span><span class="pd-stud"></span><span class="pd-stud"></span><span class="pd-stud"></span><span class="pd-stud"></span><span class="pd-stud"></span><span class="pd-stud"></span></span></div>
<div class="pd-brand-panel" style="margin-top:20px;max-width:420px"><h3>Meet, then remember</h3><p>Text on a brand panel sits on brand-fill, so it reads in every product.</p></div>
</div>
<script>document.querySelectorAll('.pd-switch').forEach(function(s){s.addEventListener('click',function(){s.setAttribute('aria-checked',String(s.getAttribute('aria-checked')!=='true'))})});document.querySelectorAll('.pd-seg').forEach(function(t){t.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;t.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',String(x===b))})})});</script>
</body>
</html>
