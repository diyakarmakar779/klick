<!-- @dsCard group="Klick" height=240 subtitle="Upcoming event with discoverability and prep" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t||"blue-light")})();</script><meta charset="utf-8"><title>EventCard</title></head>
<body>
<div class="pd-root">
<article class="pd-card" style="max-width:420px">
<div class="pd-person" style="align-items:flex-start"><div class="pd-date"><div>OCT</div><div>18</div></div><div><h4>Indie Product Meetup</h4><p style="display:flex;gap:5px;align-items:center"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true" style="width:13px;height:13px"><path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/></svg>Indiranagar, Bengaluru</p><div class="pd-chips" style="margin-top:8px"><span class="pd-badge pd-badge--brand">Planning to attend</span><span class="pd-pill"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Google Calendar</span></div></div></div>
<div class="pd-divider"></div>
<div class="pd-setting"><span>Visible to matches<small>You can change this until the event ends</small></span><button class="pd-switch" role="switch" aria-checked="true" aria-label="Visible to matches"></button></div>
<div style="margin-top:14px;font-size:13px;display:flex;justify-content:space-between"><b>Prep</b><span style="color:var(--muted-foreground)">2 of 3 done</span></div>
<div class="pd-progress"><div style="width:66%"></div></div>
</article>
</div>
<script>document.querySelectorAll('.pd-switch').forEach(function(s){s.addEventListener('click',function(){s.setAttribute('aria-checked',String(s.getAttribute('aria-checked')!=='true'))})});document.querySelectorAll('.pd-seg').forEach(function(t){t.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;t.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',String(x===b))})})});</script>
</body>
</html>
