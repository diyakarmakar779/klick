<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script>(function(){var t=new URLSearchParams(location.search).get("theme");document.documentElement.setAttribute("data-theme",t||"blue-light")})();</script><meta charset="utf-8"><title>Badge</title></head>
<body>
<div class="pd-root">
<div class="pd-stack">
<div class="pd-row"><span class="pd-badge pd-badge--neutral">Invited</span><span class="pd-badge pd-badge--outline">Hosting</span><span class="pd-badge pd-badge--brand">Planning to attend</span><span class="pd-badge pd-badge--solid">Klicked</span><span class="pd-badge pd-badge--strong">Klicked</span></div>
<div class="pd-row"><span class="pd-badge pd-badge--success"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Accepted</span><span class="pd-badge pd-badge--warning"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Overdue</span><span class="pd-badge pd-badge--destructive">Blocked</span><span class="pd-badge pd-badge--privacy"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Only you</span><span class="pd-badge pd-badge--privacy"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Mutual</span><span class="pd-badge pd-badge--privacy"><svg class="pd-i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>Event-visible</span></div>
</div>
</div>
<script>document.querySelectorAll('.pd-switch').forEach(function(s){s.addEventListener('click',function(){s.setAttribute('aria-checked',String(s.getAttribute('aria-checked')!=='true'))})});document.querySelectorAll('.pd-seg').forEach(function(t){t.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;t.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-selected',String(x===b))})})});</script>
</body>
</html>
